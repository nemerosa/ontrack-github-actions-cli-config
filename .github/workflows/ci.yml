name: ci

on:
  pull_request:
  push:
    branches:
      - main

concurrency: "ci-${{ github.ref }}"

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      packages: read

    steps:

      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24.x
          registry-url: 'https://npm.pkg.github.com'
          scope: '@nemerosa'

      - name: Install dependencies
        run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - run: npm run lint

      - run: npm run build

      - run: npm test

  self-test:
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    permissions:
      packages: read

    steps:

      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24.x
          registry-url: 'https://npm.pkg.github.com'
          scope: '@nemerosa'

      - name: Install dependencies
        run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # The runner executes dist/index.js, so it must be built from this commit's source
      - run: npm run build

      - name: "Test: configuration"
        if: github.repository_owner == 'nemerosa' && vars.ONTRACK_URL != ''
        id: test-config
        uses: ./
        env:
          YONTRACK_URL: ${{ vars.ONTRACK_URL }}
          YONTRACK_TOKEN: ${{ secrets.ONTRACK_TOKEN }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: "Test: check injected variables"
        if: github.repository_owner == 'nemerosa' && vars.ONTRACK_URL != ''
        shell: bash
        run: |
          missing=""
          [ -z "$YONTRACK_BUILD_ID" ] && missing="${missing} YONTRACK_BUILD_ID"
          [ -z "$YONTRACK_BUILD_NAME" ] && missing="${missing} YONTRACK_BUILD_NAME"
          [ -z "$YONTRACK_BRANCH_ID" ] && missing="${missing} YONTRACK_BRANCH_ID"
          [ -z "$YONTRACK_BRANCH_NAME" ] && missing="${missing} YONTRACK_BRANCH_NAME"
          [ -z "$YONTRACK_PROJECT_ID" ] && missing="${missing} YONTRACK_PROJECT_ID"
          [ -z "$YONTRACK_PROJECT_NAME" ] && missing="${missing} YONTRACK_PROJECT_NAME"
          if [ -n "$missing" ]; then
            echo "Error: The following variables are not set or empty:$missing"
            exit 1
          fi
          echo "All required variables are set"
          # Branch name on push, `<pr>/merge` on pull requests
          EXPECTED_BRANCH_NAME="${GITHUB_REF_NAME//\//-}"
          if [ "$YONTRACK_BRANCH_NAME" != "$EXPECTED_BRANCH_NAME" ]; then
            echo "Error: YONTRACK_BRANCH_NAME='$YONTRACK_BRANCH_NAME' does not match expected '$EXPECTED_BRANCH_NAME'"
            exit 1
          fi
          REPO_NAME="${GITHUB_REPOSITORY#*/}"
          if [ "$YONTRACK_PROJECT_NAME" != "$REPO_NAME" ]; then
            echo "Error: YONTRACK_PROJECT_NAME='$YONTRACK_PROJECT_NAME' does not match repository name '$REPO_NAME'"
            exit 1
          fi
          echo "All validations passed successfully!"

      # Proves the CLI put on the PATH by the action resolves as `yontrack` on every OS (yontrack.exe on Windows)
      - name: "Test: CLI on the PATH"
        if: github.repository_owner == 'nemerosa' && vars.ONTRACK_URL != ''
        shell: bash
        run: yontrack version

      # Both legs register the same build: validating it once is enough
      - name: "Test: validations and promotions"
        if: github.repository_owner == 'nemerosa' && vars.ONTRACK_URL != '' && runner.os == 'Linux'
        shell: bash
        run: |
          yontrack validate --validation BUILD --status PASSED
          yontrack validate --validation TEST --status PASSED

  release:
    if: ${{ github.ref == 'refs/heads/main' }}
    needs: [build, self-test]
    runs-on: ubuntu-latest

    permissions:
      packages: read
      contents: write

    steps:

      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
          persist-credentials: true

      - uses: actions/setup-node@v6
        with:
          node-version: 24.x
          registry-url: 'https://npm.pkg.github.com'
          scope: '@nemerosa'

      - name: Install dependencies
        run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - run: npm run build

      # Installs the CLI and sets the YONTRACK_* variables for the "Tagging the Yontrack build" step
      - name: Yontrack configuration
        if: github.repository_owner == 'nemerosa' && vars.ONTRACK_URL != ''
        uses: ./
        env:
          YONTRACK_URL: ${{ vars.ONTRACK_URL }}
          YONTRACK_TOKEN: ${{ secrets.ONTRACK_TOKEN }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Semantic release
        id: release
        run: |
          npx semantic-release
          VERSION=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          echo "version=$VERSION" >> $GITHUB_OUTPUT
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update floating major/minor tags
        if: ${{ steps.release.outputs.version != '' }}
        run: |
          VERSION="${{ steps.release.outputs.version }}"
          [[ "$VERSION" =~ ^v([0-9]+)\.([0-9]+)\.[0-9]+$ ]] || exit 0
          MAJOR="v${BASH_REMATCH[1]}"
          MINOR="v${BASH_REMATCH[1]}.${BASH_REMATCH[2]}"
          git tag -f "$MAJOR" "$VERSION"
          git tag -f "$MINOR" "$VERSION"
          git push origin -f "$MAJOR" "$MINOR"

      - name: Tagging the Yontrack build
        if: ${{ steps.release.outputs.version != '' && github.repository_owner == 'nemerosa' && vars.ONTRACK_URL != '' }}
        run: yontrack build set-property release "${{ steps.release.outputs.version }}"
